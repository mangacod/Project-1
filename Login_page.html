<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #2a3cdc;
    --blue-deep: #1a27a8;
    --sun: #ffc83d;
    --paper: #f6f7fb;
    --card: #ffffff;
    --ink: #151a33;
    --muted: #5d6384;
    --line: #d9dcec;
    --error: #c4262e;
    --ok: #12805c;
    --font: "Bricolage Grotesque", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0e1124;
      --card: #171b36;
      --ink: #eef0fb;
      --muted: #a2a8cc;
      --line: #2c3158;
      --error: #ff8a90;
      --ok: #4fd1a1;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    background: var(--paper);
    color: var(--ink);
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
    min-height: 100vh;
  }

  /* ---------- Left: the door ---------- */
  .stage {
    position: relative;
    background: var(--blue);
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(28px, 5vw, 64px);
    overflow: hidden;
  }
  .stage::before {
    content: "";
    position: absolute; inset: auto -20% -35% -20%;
    height: 70%;
    background: radial-gradient(closest-side, var(--blue-deep), transparent);
    opacity: .8;
  }
  .brand { position: relative; font-weight: 700; font-size: 1.25rem; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
  .brand i { width: 14px; height: 14px; background: var(--sun); border-radius: 50% 50% 0 0; display: inline-block; }
  .door-wrap { position: relative; display: grid; place-items: center; flex: 1; padding: 24px 0; }
  .door { width: min(300px, 62%); height: auto; overflow: visible; }
  .door .frame { fill: none; stroke: rgba(255,255,255,.9); stroke-width: 6; }
  .door .room  { fill: var(--sun); opacity: 0; transition: opacity .5s ease; }
  .door .leaf  {
    fill: var(--blue-deep);
    stroke: rgba(255,255,255,.9); stroke-width: 6;
    transform-box: fill-box; transform-origin: left center;
    transition: transform .9s cubic-bezier(.2,.8,.2,1);
  }
  .door .knob { fill: var(--sun); transition: opacity .3s; }
  /* door opens a crack while typing a password, wide on success */
  body[data-state="peek"] .door .room { opacity: .55; }
  body[data-state="peek"] .door .leaf { transform: perspective(500px) rotateY(-22deg); }
  body[data-state="open"] .door .room { opacity: 1; }
  body[data-state="open"] .door .leaf { transform: perspective(500px) rotateY(-78deg); }
  body[data-state="open"] .door .knob { opacity: 0; }

  .pitch { position: relative; max-width: 30ch; }
  .pitch h2 { font-size: clamp(1.6rem, 2.6vw, 2.4rem); line-height: 1.1; letter-spacing: -.02em; font-weight: 500; }
  .pitch p { margin-top: 12px; color: rgba(255,255,255,.78); line-height: 1.5; }

  /* ---------- Right: the form ---------- */
  .panel { display: grid; place-items: center; padding: clamp(24px, 5vw, 64px); position: relative; }
  .card { width: 100%; max-width: 420px; }
  .card h1 { font-size: clamp(2rem, 3.4vw, 2.75rem); letter-spacing: -.03em; line-height: 1.05; font-weight: 700; }
  .card .sub { margin-top: 10px; color: var(--muted); line-height: 1.5; }

  form { margin-top: 32px; display: grid; gap: 20px; }
  .field label { display: block; font-size: .92rem; font-weight: 500; margin-bottom: 8px; }
  .control { position: relative; }
  .control input {
    width: 100%; font: inherit; color: var(--ink);
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    transition: border-color .15s, box-shadow .15s;
  }
  .control input::placeholder { color: var(--muted); opacity: .7; }
  .control input:hover { border-color: var(--muted); }
  .control input:focus-visible { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(42,60,220,.18); }
  .field.invalid input { border-color: var(--error); }
  .field.invalid input:focus-visible { box-shadow: 0 0 0 4px rgba(196,38,46,.18); }
  .control.has-toggle input { padding-right: 76px; }
  .toggle {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font: inherit; font-size: .85rem; font-weight: 500; color: var(--blue);
    background: none; border: 0; padding: 8px 10px; border-radius: 8px; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .toggle, :root:not([data-theme="light"]) .link { color: #9aa6ff; } }
  .toggle:hover { background: rgba(42,60,220,.08); }
  .toggle:focus-visible, .link:focus-visible, .check input:focus-visible + .box, .social:focus-visible, .submit:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  .msg { min-height: 1.2em; margin-top: 6px; font-size: .85rem; color: var(--error); }

  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .check { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: .92rem; }
  .check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .check .box { width: 20px; height: 20px; border: 1.5px solid var(--muted); border-radius: 6px; display: grid; place-items: center; background: var(--card); transition: background .15s, border-color .15s; }
  .check .box svg { width: 12px; height: 12px; stroke: #fff; stroke-width: 3; fill: none; opacity: 0; }
  .check input:checked + .box { background: var(--blue); border-color: var(--blue); }
  .check input:checked + .box svg { opacity: 1; }
  .link { color: var(--blue); font-weight: 500; text-decoration: none; border-radius: 4px; }
  .link:hover { text-decoration: underline; text-underline-offset: 3px; }

  .submit {
    font: inherit; font-weight: 700; font-size: 1.02rem;
    color: #fff; background: var(--blue);
    border: 0; border-radius: 12px; padding: 16px 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: background .15s, transform .1s;
  }
  .submit:hover { background: var(--blue-deep); }
  .submit:active { transform: translateY(1px); }
  .submit[disabled] { cursor: progress; opacity: .85; }
  .spinner { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; display: none; animation: spin .7s linear infinite; }
  .submit.loading .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .divider { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: .85rem; }
  .divider::before, .divider::after { content: ""; height: 1px; background: var(--line); flex: 1; }
  .social {
    font: inherit; font-weight: 500; color: var(--ink);
    background: var(--card); border: 1.5px solid var(--line); border-radius: 12px;
    padding: 13px 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: border-color .15s;
  }
  .social:hover { border-color: var(--muted); }
  .social svg { width: 18px; height: 18px; }

  .foot { margin-top: 28px; color: var(--muted); text-align: center; font-size: .95rem; }
  .status { margin-top: 14px; text-align: center; font-size: .95rem; min-height: 1.4em; }
  .status.ok { color: var(--ok); font-weight: 500; }
  .status.err { color: var(--error); }

  /* ---------- Responsive ---------- */
  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; }
    .stage { padding: 24px; flex-direction: row; align-items: center; min-height: 0; }
    .door-wrap { flex: 0; padding: 0; }
    .door { width: 54px; }
    .door .frame, .door .leaf { stroke-width: 10; }
    .pitch { display: none; }
    .panel { align-items: start; padding-top: 40px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>
</head>
<body data-state="closed">

  <aside class="stage" aria-hidden="false">
    <div class="brand"><i></i> Your Brand</div>

    <div class="door-wrap" aria-hidden="true">
      <svg class="door" viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
        <path class="room" d="M20 270V100a80 80 0 0 1 160 0v170z"/>
        <path class="leaf" d="M20 270V100a80 80 0 0 1 160 0v170z"/>
        <circle class="knob" cx="152" cy="190" r="8"/>
        <path class="frame" d="M20 270V100a80 80 0 0 1 160 0v170"/>
        <path d="M0 270h200" stroke="rgba(255,255,255,.9)" stroke-width="6" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="pitch">
      <h2>Good to see you again.</h2>
      <p>Sign in to pick up where you left off.</p>
    </div>
  </aside>

  <main class="panel">
    <div class="card">
      <h1>Sign in</h1>
      <p class="sub">Use the email and password you registered with.</p>

      <form id="loginForm" novalidate>
        <div class="field" id="emailField">
          <label for="email">Email</label>
          <div class="control">
            <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required aria-describedby="emailMsg">
          </div>
          <div class="msg" id="emailMsg" role="alert"></div>
        </div>

        <div class="field" id="passField">
          <label for="password">Password</label>
          <div class="control has-toggle">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required minlength="6" aria-describedby="passMsg">
            <button type="button" class="toggle" id="toggle" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
          <div class="msg" id="passMsg" role="alert"></div>
        </div>

        <div class="row">
          <label class="check">
            <input type="checkbox" id="remember" name="remember">
            <span class="box"><svg viewBox="0 0 12 12"><path d="M2 6.5l2.6 2.6L10 3.4"/></svg></span>
            Keep me signed in
          </label>
          <a class="link" href="#forgot">Forgot password?</a>
        </div>

        <button class="submit" id="submit" type="submit">
          <span class="spinner" aria-hidden="true"></span>
          <span id="submitLabel">Sign in</span>
        </button>

        <div class="divider">or</div>

        <button class="social" type="button" id="google">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23 12.3c0-.8-.1-1.5-.2-2.2H12v4.2h6.2a5.3 5.3 0 0 1-2.3 3.5v2.9h3.7c2.2-2 3.4-5 3.4-8.4z"/><path fill="#34A853" d="M12 24c3.1 0 5.7-1 7.6-2.8l-3.7-2.9c-1 .7-2.4 1.1-3.9 1.1-3 0-5.5-2-6.4-4.7H1.8v3C3.7 21.5 7.5 24 12 24z"/><path fill="#FBBC05" d="M5.6 14.7a7.2 7.2 0 0 1 0-4.6v-3H1.8a12 12 0 0 0 0 10.6z"/><path fill="#EA4335" d="M12 4.8c1.7 0 3.2.6 4.4 1.7l3.3-3.3C17.700 1.200 15.100 0 12 0 7.500 0 3.700 2.500 1.800 6.100l3.800 3c.9-2.700 3.400-4.300 6.400-4.300z"/></svg>
          Continue with Google
        </button>
      </form>

      <div class="status" id="status" role="status" aria-live="polite"></div>
      <p class="foot">New here? <a class="link" href="#register">Create an account</a></p>
    </div>
  </main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const form = $('loginForm'), email = $('email'), pass = $('password');
  const emailField = $('emailField'), passField = $('passField');
  const emailMsg = $('emailMsg'), passMsg = $('passMsg');
  const submit = $('submit'), label = $('submitLabel'), status = $('status');
  const body = document.body;
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

  // Door reacts to the form: closed -> ajar while typing a password -> open on success
  const setState = (s) => (body.dataset.state = s);
  pass.addEventListener('focus', () => setState('peek'));
  pass.addEventListener('blur',  () => { if (body.dataset.state === 'peek') setState('closed'); });

  // Show / hide password
  $('toggle').addEventListener('click', function () {
    const show = pass.type === 'password';
    pass.type = show ? 'text' : 'password';
    this.textContent = show ? 'Hide' : 'Show';
    this.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    this.setAttribute('aria-pressed', String(show));
    pass.focus();
  });

  function check(input, field, msgEl) {
    let msg = '';
    if (input === email) {
      if (!email.value.trim()) msg = 'Enter your email address.';
      else if (!emailRe.test(email.value.trim())) msg = 'Enter a valid email, like name@example.com.';
    } else {
      if (!pass.value) msg = 'Enter your password.';
      else if (pass.value.length < 6) msg = 'Your password must be at least 6 characters.';
    }
    field.classList.toggle('invalid', !!msg);
    input.setAttribute('aria-invalid', msg ? 'true' : 'false');
    msgEl.textContent = msg;
    return !msg;
  }
  email.addEventListener('blur', () => check(email, emailField, emailMsg));
  pass.addEventListener('blur',  () => check(pass, passField, passMsg));
  email.addEventListener('input', () => emailField.classList.contains('invalid') && check(email, emailField, emailMsg));
  pass.addEventListener('input',  () => passField.classList.contains('invalid') && check(pass, passField, passMsg));

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    status.className = 'status'; status.textContent = '';
    const okEmail = check(email, emailField, emailMsg);
    const okPass  = check(pass, passField, passMsg);
    if (!okEmail || !okPass) { (okEmail ? pass : email).focus(); return; }

    submit.disabled = true; submit.classList.add('loading'); label.textContent = 'Signing in';
    try {
      /* ---- Replace this block with your real login request ----
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email.value.trim(), password: pass.value, remember: $('remember').checked })
      });
      if (!res.ok) throw new Error('Email or password is incorrect.');
      window.location.href = '/dashboard';
      ---------------------------------------------------------- */
      await new Promise((r) => setTimeout(r, 1100)); // demo delay
      setState('open');
      status.className = 'status ok';
      status.textContent = 'Signed in. Taking you to your account.';
      label.textContent = 'Signed in';
    } catch (err) {
      setState('closed');
      status.className = 'status err';
      status.textContent = err.message || 'Something went wrong. Try again.';
      label.textContent = 'Sign in';
      submit.disabled = false;
    } finally {
      submit.classList.remove('loading');
    }
  });

  $('google').addEventListener('click', () => {
    status.className = 'status';
    status.textContent = 'Connect your Google sign-in here.';
  });
})();
</script>
</body>
</html>
